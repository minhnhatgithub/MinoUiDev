<!DOCTYPE html>
<html lang="vn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinouiDev Dashboard</title>
     <link rel="icon" href="logo.jpg">
    <link rel="stylesheet" href="style.css?v=9">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <!-- Main Content -->
        <main class="main-content">
            <!-- Dashboard -->
            <div class="dashboard-wrapper">

                <header class="dashboard-header">
                    <div class="logo-area">
                        <img src="logo.jpg" alt="MinouiDev Logo"
                            style="height: 32px; width: 32px; border-radius: 6px; object-fit: cover; margin-right: 10px; box-shadow: 0 0 5px rgba(0,0,0,0.5);">
                        <h2>MinouiDev Dashboard</h2>
                    </div>
                    <div class="header-right" style="display: flex; align-items: center; gap: 15px;">
                        <div class="gtranslate_wrapper"></div>
                        <button id="btn-toggle-theme" title="Giao diện Sáng/Tối" style="background: transparent; border: none; color: var(--text-main); font-size: 20px; cursor: pointer; transition: color 0.3s;"><i class="fa-solid fa-moon" id="theme-icon"></i></button>
                        <a href="https://github.com/minhnhatgithub/MinoUiDev" target="_blank" class="github-link"><i
                                class="fa-brands fa-github"></i></a>
                    </div>
                </header>
                <!-- Stat Cards -->
                <div class="stat-cards">
                    <div class="card stat-card">
                        <i class="fa-brands fa-android stat-icon"></i>
                        <h3>CONNECTED DEVICES</h3>
                        <p id="total-devices">0</p>
                    </div>
                    <div class="card stat-card">
                        <i class="fa-solid fa-network-wired stat-icon" style="color: #00bf9a;"></i>
                        <h3>SERVER STATUS</h3>
                        <p id="server-status" style="color: #00bf9a;">ONLINE</p>
                    </div>
                    <div class="card stat-card">
                        <i class="fa-solid fa-code stat-icon" style="color: #1d8cf8;"></i>
                        <h3>SERVER VERSION</h3>
                        <p id="server-version">0.0.0</p>
                    </div>
                    <div class="card stat-card">
                        <i class="fa-solid fa-mobile-screen stat-icon" style="color: #fd5d93;"></i>
                        <h3>ACTIVE EXTRACTS</h3>
                        <p id="active-extracts">0</p>
                    </div>
                </div>

                <!-- Manager Phone Table -->
                <div class="card table-card">
                    <div class="table-header" style="flex-wrap: wrap; gap: 15px;">
    <h2>Manager Phone</h2>
    <div style="display: flex; gap: 10px; align-items: center; flex: 1; justify-content: flex-end; flex-wrap: wrap;">
        <!-- ATX Connect Group -->
        <div style="display: flex; align-items: center; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; padding: 4px; gap: 4px;">
            <div class="search-box" style="margin: 0; border: none; background: transparent; box-shadow: none; padding: 0 10px;">
                <i class="fa-solid fa-plug" style="color: #1d8cf8;"></i>
                <input type="number" id="atx-port" placeholder="ATX Port" style="width: 100px; background: transparent; border: none; color: var(--text-main); outline: none; margin-left: 8px;">
            </div>
            <button id="btn-connect-atx" class="btn" style="padding: 6px 12px; cursor: pointer; background: #00bf9a; border: none; color: white; border-radius: 6px; font-weight: 500; display: flex; align-items: center; gap: 5px;" title="Kết nối ATX Agent"><i class="fa-solid fa-link"></i> Nối</button>
            <button id="btn-scan-atx" class="btn" style="padding: 6px 12px; cursor: pointer; background: #1d8cf8; border: none; color: white; border-radius: 6px; font-weight: 500; display: flex; align-items: center; gap: 5px;" title="Quét cổng ATX Agent"><i class="fa-solid fa-satellite-dish"></i> Quét</button>
        </div>

        <div style="width: 1px; height: 30px; background: var(--border-color); margin: 0 5px; display: block;"></div>

        <!-- Search Group -->
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="search-device" placeholder="Search...">
        </div>
        <button id="btn-refresh-devices" class="btn btn-action" style="padding: 8px 12px; cursor: pointer; background: transparent; border: 1px solid var(--border-color); color: var(--text-main); border-radius: 6px;" title="Làm mới danh sách"><i class="fa-solid fa-rotate-right"></i></button>
    </div>
</div>
<div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th width="40"><input type="checkbox"></th>
                                    <th width="60">No</th>
                                    <th>DeviceID</th>
                                    <th>Name</th>
                                    <th>Model</th>
                                    <th>Status</th>
                                    <th class="text-right">Hành động</th>
                                </tr>
                            </thead>
                            <tbody id="devices-list">
                                <tr>
                                    <td colspan="7" class="loading-text">Đang tải danh sách thiết bị...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="table-footer">
                        <div class="pagination-info">
                            <span>Rows per page: </span>
                            <select>
                                <option>20</option>
                                <option>50</option>
                            </select>
                            <span id="page-info">1-0 of 0</span>
                        </div>
                        <div class="pagination-controls">
                            <button><i class="fa-solid fa-angles-left"></i></button>
                            <button><i class="fa-solid fa-angle-left"></i></button>
                            <button><i class="fa-solid fa-angle-right"></i></button>
                            <button><i class="fa-solid fa-angles-right"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal for XPath / Screenshot -->
    <div id="action-modal" class="modal">
        <div class="modal-content card">
            <span class="close-btn">&times;</span>
            <h3 id="modal-title">Device Action</h3>
            <div id="modal-body" style="margin-top: 15px; max-height: 70vh; overflow: auto;">
                <!-- Content goes here -->
            </div>
        </div>
    </div>

    <script>window.gtranslateSettings = {"default_language":"vi","wrapper_selector":".gtranslate_wrapper"}</script>
    <script src="https://cdn.gtranslate.net/widgets/latest/dropdown.js" defer></script>
    <script src="script.js?v=9"></script>
</body>

</html>
